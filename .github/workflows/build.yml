# Build & Package — hermetic pixi environment (reproducible via pixi.lock).
# Linux is fully wired; Windows and macOS keep the pixi recipe ready but
# commented until every fpm/script dependency is validated on those runners.

name: Build & Package BIMOS

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: ${{ github.ref_name }}

jobs:
  build-linux:
    name: Linux (.deb)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: latest
          manifest-path: backend/pixi.toml
          locked: true

      - name: Install system packaging tools (dpkg-deb, readelf, fpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dpkg-dev ruby ruby-dev build-essential
          sudo gem install fpm --no-document
          fpm --version

      - name: Build (frontend + nuitka + .deb)
        run: pixi run python ../builder.py
        env:
          BIMOS_VERSION: ${{ github.ref_name }}

      - name: Verify artifacts (smoke, strip, SHASUMS, .deb audit)
        run: pixi run python ../builder.py --verify
        env:
          BIMOS_VERSION: ${{ github.ref_name }}

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: bimos-linux-deb
          path: installer/dist/*.deb
          if-no-files-found: error

  # build-windows:
  #   name: Windows (.exe)
  #   runs-on: windows-latest

  # build-macos:
  #   name: macOS (.dmg)
  #   runs-on: macos-14

  release:
    name: Create GitHub Release
    needs: [build-linux]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BIMOS ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
