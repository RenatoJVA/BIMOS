# Build & Package — hermetic pixi environment (reproducible via pixi.lock).
# Linux is fully wired; Windows and macOS keep the pixi recipe ready but
# commented until every fpm/script dependency is validated on those runners.

name: Build & Package BIMOS

on:
  # Manual only: release builds are intentionally not triggered by pushes or
  # tags until the CI budget is approved. Re-add the tag trigger below to
  # restore tag-driven releases:
  # push:
  #   tags:
  #     - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux (.deb)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: latest
          manifest-path: backend/pixi.toml
          locked: true

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(pixi run python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version v${VERSION}" >&2
            exit 1
          fi

      - name: Install system packaging tools (dpkg-deb, readelf, fpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dpkg-dev ruby ruby-dev build-essential
          sudo gem install fpm --no-document
          fpm --version

      - name: Build (frontend + nuitka + .deb)
        run: pixi run python ../builder.py

      - name: Verify artifacts (smoke, strip, SHASUMS, .deb audit)
        run: pixi run python ../builder.py --verify

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: bimos-linux-deb
          path: installer/dist/*.deb
          if-no-files-found: error

  # build-windows:
  #   name: Windows (.exe)
  #   runs-on: windows-latest

  # build-macos:
  #   name: macOS (.dmg)
  #   runs-on: macos-14

  release:
    name: Create GitHub Release
    needs: [build-linux]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BIMOS ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
