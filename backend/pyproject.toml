[project]
name = "bimos"
version = "0.1.0"
description = "Biomolecular Modeling Suite — CLI-first backend"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Renato J. V. A.", email = "renatojva@example.com" },
]
dependencies = [
    "click>=8.1.7",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "rich-click>=1.9.7",
]

[project.optional-dependencies]
db = [
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
]
gui = [
    "pywebview>=6.2.1",
    "pythonnet>=3.0.5; sys_platform == 'win32'",
    "pyqt6>=6.11.0; sys_platform != 'win32'",
    "pyqt6-webengine>=6.11.0; sys_platform != 'win32'",
    "qtpy>=2.4.3; sys_platform != 'win32'",
]
monitoring = [
    "psutil>=5.9.0",
    "zstandard>=0.25.0",
]
build = [
    "nuitka>=2.4.0",
]

[project.scripts]
bimos = "bimos.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bimos"]
include = ["bimos/config/defaults/*"]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
    "types-pyyaml>=6.0.12.20260518",
    "types-psutil>=7.2.2.20260518",
    "mypy>=1.0.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers --strict-config"
markers = [
    "slow: Pruebas lentas (>10s), omitir con -m 'not slow'",
    "e2e: Pruebas end-to-end que requieren Docker",
    "gpu: Pruebas que requieren GPU",
    "security: Pruebas de seguridad",
    "performance: Pruebas de rendimiento",
]
filterwarnings = [
    'ignore::PendingDeprecationWarning',
    'ignore::DeprecationWarning:fastapi',
    'ignore::DeprecationWarning:pydantic',
]

[tool.coverage.run]
source = ["bimos"]
omit = ["bimos/ui/*", "bimos/scripts/*"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = [
    "E", "W", "F",
    "I",
    "N",
    "UP",
    "B", "B9",
    "SIM",
    "ARG",
    "C4",
    "T10",
    "S",
    "PLE", "PLR",
    "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI treats File()/Form()/Depends() as immutable default-args descriptors
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Path", "fastapi.Query", "fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# FastAPI multipart handlers: File()/Form() default args are FastAPI descriptors
"bimos/api/endpoints/dock.py" = ["B008", "PLR0913"]
"bimos/api/endpoints/simulate.py" = ["B008"]
# Deliberate silent best-effort theme detection: any subprocess/tool missing must
# not crash theme detection; fall through to the next method.
"bimos/api/server.py" = ["S110", "S607", "PLR0912", "PLR0911"]
"bimos/api/endpoints/system.py" = ["S110", "S607"]
# Seed data uses random only for plausible demo values, not cryptography.
"bimos/infrastructure/database.py" = ["S311"]
# Container/infra code shells out to docker/podman with argv arrays (no shell=True);
# command tokens come from job config, not user free text.
"bimos/infrastructure/container.py" = ["S603", "S607", "PLR0915", "PLR0913", "PLR0912"]
"bimos/infrastructure/job_store.py" = ["S603", "S110", "S112"]
# GROMACS/ORCA/Gaussian are invoked by name from $PATH (host/CONDA_ENV), argv-only
"bimos/quantum_chemistry/pipeline.py" = ["S603", "S607", "PLR0915", "PLR0912"]
"bimos/quantum_chemistry/itp.py" = ["PLR2004"]
# SQL table names come from an allow-list (ALLOWED_TABLES / sqlite_master), see
# _resolve_table_name; queries are read-only.
"bimos/infrastructure/chembl_db.py" = ["S608"]
# High-branch monolithic MD pipeline runner: validated by integration tests.
"bimos/molecular_dynamics/pipeline.py" = ["PLR0912", "PLR0915", "PLR2004"]
"bimos/docking/pipeline.py" = ["PLR0915", "PLR0913"]
# Click command groups with many options: standard click pattern.
"bimos/cli/main.py" = ["PLR0913"]
"bimos/cli/commands/dock.py" = ["PLR0913"]
"bimos/cli/commands/predict.py" = ["PLR0913"]
"bimos/cli/commands/workflow.py" = ["PLR0913"]
# Tests intentionally use assert (pytest idiom), literal values, and fixtures
# with unused parameters (dependency injection by name).
"tests/**/*.py" = ["S101", "PLR2004", "ARG001", "ARG002", "ARG005", "S108", "SIM117", "PLR0913", "F841", "RUF059"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mutmut]
source_paths = ["bimos"]
pytest_add_cli_args = ["--ignore=tests/integration", "--ignore=tests/security", "--ignore=tests/e2e", "--ignore=tests/performance", "--ignore=tests/mutation", "--ignore=tests/unit/test_container.py", "--ignore=tests/unit/test_job_store.py", "-x", "-q", "--tb=short"]
pytest_add_cli_args_test_selection = ["tests/unit/test_paths.py", "tests/unit/test_templates.py", "tests/unit/test_elements.py"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["bimos/scripts/"]

[[tool.mypy.overrides]]
module = ["bimos.shared.user_config"]
ignore_missing_imports = true


